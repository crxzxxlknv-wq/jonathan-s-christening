<!DOCTYPE html>
<html>
<head>
  <title>Christening & 1st Birthday</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: #eef7fb;
      color: #4a6c7a;
      overflow-x: hidden;
    }

    /* 💌 ENVELOPE */
    .envelope-screen {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #eef7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .envelope {
      width: 220px;
      height: 140px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      position: relative;
      cursor: pointer;
    }

    .flap {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 110px solid transparent;
      border-right: 110px solid transparent;
      border-bottom: 70px solid #cfe8f3;
      top: -70px;
      left: 0;
      transition: 0.8s;
      transform-origin: bottom;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .open-text {
      margin-top: 15px;
      color: #7aaec4;
    }

    /* 🎉 CONTENT */
    .content {
      display: none;
      padding: 40px 20px;
    }

    .show {
      display: block;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    h1 {
      font-size: 28px;
    }

    .name {
      font-size: 38px;
      color: #89c2d9;
      margin: 10px 0;
    }

    .section {
      margin-top: 30px;
    }

    /* 🎈 BALLOONS */
    .balloon {
      position: fixed;
      bottom: -150px;
      width: 40px;
      height: 50px;
      background: #cfe8f3;
      border-radius: 50%;
      animation: float 10s infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 40px;
      background: #aaa;
      left: 50%;
      top: 50px;
    }

    @keyframes float {
      0% {transform: translateY(0);}
      100% {transform: translateY(-110vh);}
    }

    /* 🖼️ GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<!-- 💌 ENVELOPE -->
<div class="envelope-screen" id="envelopeScreen">
  <div>
    <div class="envelope" id="envelope">
      <div class="flap"></div>
    </div>
    <div class="open-text">Tap to Open 💌</div>
  </div>
</div>

<!-- 🎈 BALLOONS -->
<div class="balloon" style="left:10%; animation-delay:0s;"></div>
<div class="balloon" style="left:30%; animation-delay:2s;"></div>
<div class="balloon" style="left:60%; animation-delay:4s;"></div>
<div class="balloon" style="left:80%; animation-delay:1s;"></div>

<!-- 🎉 CONTENT -->
<div class="content" id="mainContent">

  <h1>You're Invited</h1>
  <p>to celebrate the</p>

  <div class="name">Christening & 1st Birthday</div>

  <h2>[Baby's Name]</h2>

  <div class="section">
    <p>📅 February 14, 2026</p>
    <p>⏰ 10:00 AM</p>
    <p>📍 Your Venue Here</p>
  </div>

  <!-- 🖼️ GALLERY -->
  <div class="section">
    <h2>Baby Moments 🍼</h2>
    <div class="gallery">
      <img src="baby1.jpg">
      <img src="baby2.jpg">
      <img src="baby3.jpg">
      <img src="baby4.jpg">
    </div>
  </div>

  <!-- 🗺️ MAP -->
  <div class="section">
    <iframe 
      src="https://www.google.com/maps?q=Manila&output=embed"
      width="100%" height="250" style="border:0;">
    </iframe>
  </div>

</div>

<!-- 🎵 MUSIC -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  const envelope = document.getElementById("envelope");
  const screen = document.getElementById("envelopeScreen");
  const content = document.getElementById("mainContent");

  envelope.addEventListener("click", () => {
    envelope.classList.add("open");

    setTimeout(() => {
      screen.style.display = "none";
      content.classList.add("show");
    }, 800);
  });
</script>

</body>
</html>
